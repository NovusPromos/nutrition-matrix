<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nutrition Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-outer-spin-button, 
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased pb-24">
    <div id="app" class="max-w-md mx-auto p-4"></div>

    <script>
        const mealPlan = [
            { day: "Monday", meals: [
                { name: "Breakfast", detail: "40g All-Bran, 250g Fat-Free Greek Yogurt, Sweetener.", macros: "280 kcal | 30g P" },
                { name: "Lunch", detail: "2 Slices Sasko Brown Bread, 200g Pilchards in Tomato Sauce.", macros: "330 kcal | 38g P" },
                { name: "Pre-Gym", detail: "2 Boiled Eggs, 1 Banana.", macros: "240 kcal | 12g P" },
                { name: "Supper", detail: "180g Chicken Breast (air-fried), 125g Frozen Veg, 100g cooked Macaroni.", macros: "450 kcal | 55g P" }
            ]},
            { day: "Tuesday", meals: [
                { name: "Breakfast", detail: "3 Eggs (1 whole, 2 whites) scrambled, 1 Apple.", macros: "200 kcal | 18g P" },
                { name: "Lunch", detail: "2 Slices Sasko Brown Bread, 1 Tin (170g) Tuna in brine.", macros: "250 kcal | 34g P" },
                { name: "Pre-Gym", detail: "250g Fat-Free Greek Yogurt, 1/2 Banana.", macros: "190 kcal | 25g P" },
                { name: "Supper", detail: "150g Lean Steak, 125g Frozen Veg, 100g cooked Rice.", macros: "480 kcal | 45g P" }
            ]},
            { day: "Wednesday", meals: [
                { name: "Breakfast", detail: "40g Oats (cooked in water), 2 Boiled Eggs.", macros: "290 kcal | 17g P" },
                { name: "Lunch", detail: "2 Slices Sasko Brown Bread, 200g Pilchards in Tomato Sauce.", macros: "330 kcal | 38g P" },
                { name: "Pre-Gym", detail: "250g Fat-Free Greek Yogurt.", macros: "140 kcal | 25g P" },
                { name: "Supper", detail: "180g Chicken Breast, 125g Frozen Veg, 100g cooked Potatoes.", macros: "420 kcal | 55g P" }
            ]},
            { day: "Thursday", meals: [
                { name: "Breakfast", detail: "40g All-Bran, 250g Fat-Free Greek Yogurt.", macros: "280 kcal | 30g P" },
                { name: "Lunch", detail: "2 Slices Sasko Brown Bread, 120g Lean Ham, Mustard.", macros: "260 kcal | 25g P" },
                { name: "Pre-Gym", detail: "2 Boiled Eggs, 1 Apple.", macros: "200 kcal | 12g P" },
                { name: "Supper", detail: "180g Chicken Breast, 125g Frozen Veg, 100g cooked Pap.", macros: "420 kcal | 55g P" }
            ]},
            { day: "Friday", meals: [
                { name: "Breakfast", detail: "250g Fat-Free Greek Yogurt, 1 Apple.", macros: "200 kcal | 25g P" },
                { name: "Lunch", detail: "2 Slices Sasko Brown Bread, 200g Pilchards in Tomato Sauce.", macros: "330 kcal | 38g P" },
                { name: "Snack", detail: "2 Boiled Eggs.", macros: "140 kcal | 12g P" },
                { name: "Supper", detail: "200g Lean Steak, Large side salad (zero oil).", macros: "450 kcal | 50g P" }
            ]},
            { day: "Saturday", meals: [
                { name: "Cheat Day", detail: "Eat desired foods. Strictly cap total intake at 2,200 calories to preserve weekly deficit.", macros: "Max 2,200 kcal" }
            ]},
            { day: "Sunday", meals: [
                { name: "Breakfast", detail: "3 Eggs (1 whole, 2 whites) scrambled, 1/2 Banana.", macros: "200 kcal | 18g P" },
                { name: "Lunch", detail: "2 Slices Sasko Brown Bread, 200g Pilchards in Tomato Sauce.", macros: "330 kcal | 38g P" },
                { name: "Snack", detail: "250g Fat-Free Greek Yogurt.", macros: "140 kcal | 25g P" },
                { name: "Supper", detail: "180g Chicken Breast, 125g Frozen Veg, 100g cooked Rice.", macros: "400 kcal | 55g P" }
            ]}
        ];

        const defaultGroceries = [
            { id: "g1", name: "Fat-Free Plain Greek Yogurt", unit: "500g tubs", defaultQty: 3 },
            { id: "g2", name: "Pilchards in Tomato Sauce", unit: "400g tins", defaultQty: 2 },
            { id: "g3", name: "Eggs (Large)", unit: "Dozen", defaultQty: 2 },
            { id: "g4", name: "Chicken Breast (Raw)", unit: "kg", defaultQty: 1.5 },
            { id: "g5", name: "Lean Steak", unit: "kg", defaultQty: 0.5 },
            { id: "g6", name: "Sasko Brown Bread", unit: "Loaf", defaultQty: 1 },
            { id: "g7", name: "Lean Ham", unit: "250g pack", defaultQty: 1 },
            { id: "g8", name: "Tuna in Brine", unit: "170g tins", defaultQty: 2 },
            { id: "g9", name: "Frozen Mixed Veg", unit: "1kg bag", defaultQty: 1 },
            { id: "g10", name: "Apples", unit: "Bag", defaultQty: 1 },
            { id: "g11", name: "Bananas", unit: "Bunch", defaultQty: 1 },
            { id: "g12", name: "All-Bran Flakes", unit: "Box", defaultQty: 0 },
            { id: "g13", name: "Rolled Oats", unit: "kg", defaultQty: 0 }
        ];

        const storageKey = 'nutrition_matrix_v1';
        let state = JSON.parse(localStorage.getItem(storageKey)) || { tab: 'meals', groceries: {} };

        // Initialize grocery state if empty
        if (Object.keys(state.groceries).length === 0) {
            for (let i = 0; i < defaultGroceries.length; i++) {
                let item = defaultGroceries[i];
                state.groceries[item.id] = { qty: item.defaultQty, checked: true };
            }
            saveState();
        }

        function saveState() {
            localStorage.setItem(storageKey, JSON.stringify(state));
        }

        function switchTab(tabName) {
            state.tab = tabName;
            saveState();
            renderApp();
        }

        function updateGroceryQty(id, value) {
            let num = parseFloat(value);
            if (isNaN(num) || num < 0) num = 0;
            state.groceries[id].qty = num;
            saveState();
        }

        function toggleGroceryCheck(id) {
            state.groceries[id].checked = !state.groceries[id].checked;
            saveState();
            renderApp();
        }

        function shareToWhatsApp() {
            let text = "Hi! Please can you get these groceries for my meal plan:\\n\\n";
            for (let i = 0; i < defaultGroceries.length; i++) {
                let item = defaultGroceries[i];
                let itemState = state.groceries[item.id];
                if (itemState.checked && itemState.qty > 0) {
                    text += "- " + itemState.qty + "x " + item.unit + " " + item.name + "\\n";
                }
            }
            let whatsappUrl = "whatsapp://send?text=" + encodeURIComponent(text);
            window.location.href = whatsappUrl;
        }

        function renderApp() {
            const app = document.getElementById('app');
            
            let html = '<header class="mb-6 sticky top-0 bg-gray-900 py-4 z-10 border-b border-gray-800">' +
                       '<h1 class="text-xl font-bold text-green-400 mb-4 tracking-tight">NUTRITION MATRIX</h1>' +
                       '<div class="flex space-x-2">' +
                       '<button onclick="switchTab(\'meals\')" class="flex-1 py-2 text-sm font-semibold rounded ' + (state.tab === 'meals' ? 'bg-green-600 text-white' : 'bg-gray-800 text-gray-400') + ' transition-colors">Meal Plan</button>' +
                       '<button onclick="switchTab(\'groceries\')" class="flex-1 py-2 text-sm font-semibold rounded ' + (state.tab === 'groceries' ? 'bg-green-600 text-white' : 'bg-gray-800 text-gray-400') + ' transition-colors">Grocery List</button>' +
                       '</div></header>';

            html += '<main class="space-y-6">';

            if (state.tab === 'meals') {
                for (let i = 0; i < mealPlan.length; i++) {
                    let day = mealPlan[i];
                    html += '<div class="bg-gray-800 rounded-lg p-4 border border-gray-700 shadow-sm">' +
                            '<h2 class="font-bold text-lg text-gray-100 mb-3 border-b border-gray-700 pb-2">' + day.day + '</h2>' +
                            '<div class="space-y-3">';
                    
                    for (let j = 0; j < day.meals.length; j++) {
                        let meal = day.meals[j];
                        html += '<div class="bg-gray-900 p-3 rounded">' +
                                '<div class="flex justify-between items-center mb-1">' +
                                '<span class="text-green-400 font-semibold text-sm">' + meal.name + '</span>' +
                                '<span class="text-gray-500 text-xs font-mono">' + meal.macros + '</span>' +
                                '</div>' +
                                '<p class="text-gray-300 text-sm">' + meal.detail + '</p>' +
                                '</div>';
                    }
                    html += '</div></div>';
                }
            } else {
                html += '<div class="bg-gray-800 rounded-lg p-4 border border-gray-700 shadow-sm mb-20">' +
                        '<div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">' +
                        '<h2 class="font-bold text-lg text-gray-100">Procurement List</h2>' +
                        '</div><div class="space-y-2">';

                for (let i = 0; i < defaultGroceries.length; i++) {
                    let item = defaultGroceries[i];
                    let itemState = state.groceries[item.id];
                    let checkedClass = itemState.checked ? 'text-gray-100' : 'text-gray-600 line-through';
                    let bgClass = itemState.checked ? 'bg-gray-900 border-gray-700' : 'bg-gray-900 border-gray-800 opacity-50';

                    html += '<div class="flex items-center justify-between p-3 rounded border ' + bgClass + ' transition-opacity">' +
                            '<div class="flex items-center space-x-3 flex-1" onclick="toggleGroceryCheck(\'' + item.id + '\')">' +
                            '<div class="w-6 h-6 rounded border flex items-center justify-center ' + (itemState.checked ? 'bg-green-600 border-green-500' : 'border-gray-600') + '">' +
                            (itemState.checked ? '<span class="text-white text-xs">&#10003;</span>' : '') +
                            '</div>' +
                            '<div class="flex flex-col">' +
                            '<span class="text-sm font-semibold ' + checkedClass + '">' + item.name + '</span>' +
                            '<span class="text-xs text-gray-500">' + item.unit + '</span>' +
                            '</div></div>' +
                            '<div class="w-20 ml-2" onclick="event.stopPropagation()">' +
                            '<input type="number" step="0.5" value="' + itemState.qty + '" oninput="updateGroceryQty(\'' + item.id + '\', this.value)" class="w-full bg-gray-700 text-white text-center rounded p-2 text-lg focus:outline-none focus:ring-2 focus:ring-green-500">' +
                            '</div></div>';
                }
                
                html += '</div></div>' +
                        '<div class="fixed bottom-0 left-0 right-0 p-4 bg-gray-900 border-t border-gray-800">' +
                        '<button onclick="shareToWhatsApp()" class="w-full max-w-md mx-auto block bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-4 rounded shadow-lg transition-colors">' +
                        'Send List via WhatsApp' +
                        '</button></div>';
            }

            html += '</main>';
            app.innerHTML = html;
        }

        renderApp();
    </script>
</body>
</html>
