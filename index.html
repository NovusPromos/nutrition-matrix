<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modular Ledger</title>
    
    <link rel="icon" type="image/jpeg" href="nutrition-icon.jpg">
    <link rel="apple-touch-icon" href="nutrition-icon.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ledger">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased pb-24">
    <div id="app" class="max-w-md mx-auto"></div>

    <script>
        const proteins = [
            { name: "Pork Fillet (Raw)", qty: "125g" },
            { name: "Ostrich Mince/Steak", qty: "120g" },
            { name: "Hake Fillets", qty: "150g" },
            { name: "Extra Lean Beef Mince 5%", qty: "125g" },
            { name: "Chicken Breast (Raw)", qty: "115g" },
            { name: "Lean Beef Steak (Raw)", qty: "110g" },
            { name: "Pilchards in Tomato Sauce", qty: "150g" },
            { name: "Tuna in Brine (Drained)", qty: "170g tin" },
            { name: "Chicken Livers (Raw)", qty: "150g" },
            { name: "Fat-Free Cottage Cheese", qty: "250g tub" },
            { name: "Eggs (1 Whole + 4 Whites)", qty: "5 total eggs" }
        ];

        const carbs = [
            { name: "Jungle Oats (Dry)", qty: "40g" },
            { name: "Rice: White/Brown (Dry)", qty: "40g" },
            { name: "Maize Meal / Pap (Dry)", qty: "40g" },
            { name: "Macaroni / Pasta (Dry)", qty: "40g" },
            { name: "Sasko Brown Bread", qty: "2 Slices" },
            { name: "Potatoes / Sweet Potatoes", qty: "150g" },
            { name: "All-Bran Flakes", qty: "40g" },
            { name: "Samp (Dry)", qty: "40g" },
            { name: "Plain Rice Cakes", qty: "4 Large" },
            { name: "Wholewheat Wrap", qty: "1 Standard" },
            { name: "Couscous (Dry)", qty: "40g" },
            { name: "Corn on the Cob", qty: "1 Large" },
            { name: "Apple", qty: "1 Large" },
            { name: "Banana", qty: "1 Medium" },
            { name: "Strawberries", qty: "300g" },
            { name: "Pineapple / Watermelon", qty: "250g" },
            { name: "Naartjies", qty: "2 Medium" }
        ];

        const freeList = [
            { name: "Green Veggies (Spinach/Broccoli)", qty: "Unlimited" },
            { name: "Cauliflower / Cabbage", qty: "Unlimited" },
            { name: "Brinjal / Eggplant (Dry Roasted)", qty: "Unlimited" },
            { name: "Dill Gherkins / Pickles", qty: "Unlimited" },
            { name: "Moir's Sugar-Free Jelly", qty: "1 Bowl" },
            { name: "Black Coffee / Tea", qty: "Unlimited" }
        ];

        const storageKey = 'modular_ledger_v2';
        
        let state = JSON.parse(localStorage.getItem(storageKey));
        let todayStr = new Date().toDateString();

        if (!state || state.date !== todayStr) {
            state = { date: todayStr, log: [], tab: 'protein' };
            saveState();
        }

        function saveState() {
            localStorage.setItem(storageKey, JSON.stringify(state));
        }

        function switchTab(tabName) {
            state.tab = tabName;
            saveState();
            renderApp();
        }

        function addBlock(type, name, qty) {
            state.log.push({ id: Date.now(), type: type, name: name, qty: qty });
            saveState();
            renderApp();
        }

        function removeItem(id) {
            let newLog = [];
            for(let i=0; i<state.log.length; i++) {
                if(state.log[i].id !== id) newLog.push(state.log[i]);
            }
            state.log = newLog;
            saveState();
            renderApp();
        }

        function resetDay() {
            if(confirm("Wipe today's ledger?")) {
                state.log = [];
                saveState();
                renderApp();
            }
        }

        function renderApp() {
            const app = document.getElementById('app');
            
            let pCount = 0;
            let cCount = 0;
            for(let i=0; i<state.log.length; i++) {
                if(state.log[i].type === 'protein') pCount++;
                if(state.log[i].type === 'carb') cCount++;
            }

            let totalCals = 340 + (pCount * 140) + (cCount * 140);
            let totalPro = pCount * 26;

            let pColor = pCount === 5 ? 'text-green-400' : (pCount > 5 ? 'text-red-400' : 'text-blue-400');
            let cColor = cCount === 4 ? 'text-green-400' : (cCount > 4 ? 'text-red-400' : 'text-orange-400');
            let calColor = totalCals <= 1600 ? 'text-white' : 'text-red-500';

            let html = '<header class="sticky top-0 bg-gray-900 z-20 border-b border-gray-800 p-4 shadow-md">' +
                       '<div class="flex justify-between items-end mb-4">' +
                       '<div><h1 class="text-2xl font-black tracking-tight text-gray-100">LEDGER</h1>' +
                       '<p class="text-xs text-gray-500 font-mono mt-1">TRACE FATS: 340 KCAL BASE</p></div>' +
                       '<div class="text-right"><div class="text-3xl font-black font-mono ' + calColor + '">' + totalCals + '</div>' +
                       '<div class="text-xs text-gray-500 font-bold tracking-wider">/ 1600 KCAL</div></div></div>' +
                       '<div class="grid grid-cols-2 gap-3 mb-4">' +
                       '<div class="bg-gray-800 rounded p-2 text-center border border-gray-700">' +
                       '<div class="text-xs text-gray-400 font-bold mb-1">PROTEIN BLOCKS</div>' +
                       '<div class="text-xl font-mono font-bold ' + pColor + '">' + pCount + ' / 5</div>' +
                       '<div class="text-xs text-gray-500">(' + totalPro + 'g total)</div></div>' +
                       '<div class="bg-gray-800 rounded p-2 text-center border border-gray-700">' +
                       '<div class="text-xs text-gray-400 font-bold mb-1">CARB BLOCKS</div>' +
                       '<div class="text-xl font-mono font-bold ' + cColor + '">' + cCount + ' / 4</div>' +
                       '<div class="text-xs text-gray-500">(Max Limit)</div></div></div>' +
                       '<div class="flex space-x-2">' +
                       '<button onclick="switchTab(\'protein\')" class="flex-1 py-2 text-xs font-bold rounded ' + (state.tab === 'protein' ? 'bg-blue-600 text-white' : 'bg-gray-800 text-gray-400') + ' transition-colors">PROTEIN</button>' +
                       '<button onclick="switchTab(\'carb\')" class="flex-1 py-2 text-xs font-bold rounded ' + (state.tab === 'carb' ? 'bg-orange-600 text-white' : 'bg-gray-800 text-gray-400') + ' transition-colors">CARBS</button>' +
                       '<button onclick="switchTab(\'free\')" class="flex-1 py-2 text-xs font-bold rounded ' + (state.tab === 'free' ? 'bg-green-600 text-white' : 'bg-gray-800 text-gray-400') + ' transition-colors">FREE BULK</button>' +
                       '</div></header>';

            html += '<main class="p-4 space-y-6">';

            let activeList = state.tab === 'protein' ? proteins : (state.tab === 'carb' ? carbs : freeList);
            let addColor = state.tab === 'protein' ? 'bg-blue-600 hover:bg-blue-500' : (state.tab === 'carb' ? 'bg-orange-600 hover:bg-orange-500' : 'bg-green-600 hover:bg-green-500');

            html += '<div class="grid grid-cols-1 gap-2">';
            for(let i=0; i<activeList.length; i++) {
                let item = activeList[i];
                html += '<button onclick="addBlock(\'' + state.tab + '\', \'' + item.name + '\', \'' + item.qty + '\')" class="flex justify-between items-center bg-gray-800 p-3 rounded border border-gray-700 active:bg-gray-700 transition-colors text-left">' +
                        '<div class="flex flex-col"><span class="text-sm font-bold text-gray-100">' + item.name + '</span>' +
                        '<span class="text-xs text-gray-400 mt-1">' + item.qty + '</span></div>' +
                        '<div class="' + addColor + ' text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-lg">+</div>' +
                        '</button>';
            }
            html += '</div>';

            html += '<div class="mt-8 border-t border-gray-800 pt-6"><h2 class="text-sm font-bold text-gray-400 tracking-wider mb-4">DAILY LOG</h2>';
            
            if(state.log.length === 0) {
                html += '<p class="text-sm text-gray-600 italic">No blocks logged today.</p>';
            } else {
                html += '<div class="space-y-2">';
                for(let i=state.log.length-1; i>=0; i--) {
                    let logItem = state.log[i];
                    let badgeColor = logItem.type === 'protein' ? 'bg-blue-900 text-blue-300' : (logItem.type === 'carb' ? 'bg-orange-900 text-orange-300' : 'bg-green-900 text-green-300');
                    
                    html += '<div class="flex justify-between items-center bg-gray-900 p-3 rounded border border-gray-800">' +
                            '<div class="flex items-center space-x-3">' +
                            '<span class="text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider ' + badgeColor + '">' + logItem.type + '</span>' +
                            '<span class="text-sm text-gray-200">' + logItem.name + '</span></div>' +
                            '<button onclick="removeItem(' + logItem.id + ')" class="text-gray-600 hover:text-red-500 font-bold px-2 text-lg">&times;</button>' +
                            '</div>';
                }
                html += '</div>';
            }

            html += '<button onclick="resetDay()" class="w-full mt-6 bg-gray-800 border border-red-900 text-red-500 font-bold py-3 px-4 rounded transition-colors">RESET LEDGER</button>';
            html += '</div></main>';

            app.innerHTML = html;
        }

        renderApp();
    </script>
</body>
</html>
